name: evallab

services:
  mysql:
    image: mysql:8.0.40
    container_name: evallab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 docker/.env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-evallab}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  server:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: evallab/server:0.1.0
    container_name: evallab-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EVALLAB_DB_HOST: mysql
      EVALLAB_DB_PORT: 3306
      EVALLAB_DB_NAME: ${MYSQL_DATABASE:-evallab}
      EVALLAB_DB_USERNAME: root
      EVALLAB_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 容器内直连服务名，覆盖 application.yml 里的 localhost 默认值
      EVALLAB_FAULT_AGENT_URL: http://agent:8081
      EVALLAB_WEBSEARCH_AGENT_URL: http://websearch-agent:8083
      # Judge 为可选能力：留空则不装配 LLM，评测照常进行
      EVALLAB_LLM_BASE_URL: ${EVALLAB_LLM_BASE_URL:-}
      EVALLAB_LLM_API_KEY: ${EVALLAB_LLM_API_KEY:-}
      EVALLAB_LLM_MODEL: ${EVALLAB_LLM_MODEL:-gpt-4o-mini}
    extra_hosts:
      # 让容器能访问宿主机上的本地模型（如 Ollama）
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-8080}:8080"

  agent:
    build:
      context: ..
      dockerfile: agents/demo/Dockerfile
    image: evallab/agent-demo:0.1.0
    container_name: evallab-agent
    restart: unless-stopped
    # JRE 镜像无 curl，server 不设 healthcheck；自检上报失败只告警，不影响 Agent 启动
    depends_on:
      server:
        condition: service_started
    environment:
      # 自检上报（补充路径），失败仅告警不影响启动
      EVALLAB_PLATFORM_URL: http://server:8080
      # 比平台侧 90s 超时短、比正常流程长，既能触发 TIMEOUT 又不会拖慢整轮评测太久
      EVALLAB_AGENT_TIMEOUT_DELAY: ${AGENT_TIMEOUT_DELAY:-65s}
    ports:
      - "${AGENT_PORT:-8081}:8081"

  websearch-agent:
    build:
      context: ..
      dockerfile: agents/websearch/Dockerfile
    image: evallab/agent-websearch:0.1.0
    container_name: evallab-websearch-agent
    restart: unless-stopped
    environment:
      EVALLAB_WEBSEARCH_AGENT_PORT: 8083
      EVALLAB_WEBSEARCH_TOP_K: ${WEBSEARCH_TOP_K:-1}
    ports:
      - "${WEBSEARCH_AGENT_PORT:-8083}:8083"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: evallab/web:0.1.0
    container_name: evallab-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  mysql-data:
