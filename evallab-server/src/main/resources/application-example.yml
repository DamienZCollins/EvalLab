# 配置模板：复制为 application-local.yml（已被 .gitignore 排除）后填写，或改用环境变量
# 启动方式：SPRING_PROFILES_ACTIVE=local java -jar evallab-server.jar
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/evallab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: <在此填写数据库密码，不要提交到 Git>

server:
  port: 8080
