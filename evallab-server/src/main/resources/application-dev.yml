# 本地开发覆盖项；连接信息仍由环境变量提供（见 .env.example）
logging:
  level:
    com.evallab: debug

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    enabled: true

evallab:
  demo:
    # 首次启动写入 10 个演示用例（5 正常 + 5 故障），表非空时跳过
    seed-enabled: true
    websearch-cases-enabled: true
