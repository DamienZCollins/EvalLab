spring:
  application:
    name: evallab-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${EVALLAB_DB_HOST:localhost}:${EVALLAB_DB_PORT:3306}/${EVALLAB_DB_NAME:evallab}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${EVALLAB_DB_USERNAME:root}
    password: ${EVALLAB_DB_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      # 时间统一输出 ISO 8601，不使用 yyyy-MM-dd HH:mm:ss 之类的自定义格式
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${EVALLAB_SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
