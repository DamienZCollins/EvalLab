spring:
  application:
    name: server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${EVALLAB_DB_HOST:localhost}:${EVALLAB_DB_PORT:3306}/${EVALLAB_DB_NAME:evallab}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${EVALLAB_DB_USERNAME:root}
    password: ${EVALLAB_DB_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai
    # 全站 JSON 字段统一 snake_case，与 Trace 契约、数据库列名保持一致
    property-naming-strategy: SNAKE_CASE
    serialization:
      # 时间统一输出 ISO 8601，不使用 yyyy-MM-dd HH:mm:ss 之类的自定义格式
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${EVALLAB_SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

evallab:
  eval:
    # 0.8：顺序不同(0.8)仍通过，缺任一步骤(≤0.75)即失败；归因见设计决策 D2
    tool-correctness-threshold: 0.8
  llm:
    # 留空即关闭 Judge：评测照常跑确定性评分器，只是没有参考型评分
    base-url: ${EVALLAB_LLM_BASE_URL:}
    api-key: ${EVALLAB_LLM_API_KEY:}
    model: ${EVALLAB_LLM_MODEL:gpt-4o-mini}
    # Judge 取 0 保证同一输入可复现
    temperature: 0.0
    timeout: ${EVALLAB_LLM_TIMEOUT:60s}
  agent:
    registry:
      fault-injection-agent:
        base-url: ${EVALLAB_FAULT_AGENT_URL:http://localhost:8081}
      web-search-agent:
        base-url: ${EVALLAB_WEBSEARCH_AGENT_URL:http://localhost:8083}
        # 需大于 Agent 侧 TIMEOUT 故障的阻塞时长，否则拿不到 TIMEOUT 结果
        timeout: ${EVALLAB_AGENT_TIMEOUT:90s}

logging:
  level:
    root: info
